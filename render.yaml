services:
  - type: web
    name: gridwise-optimizer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://router.bynara.id/v1
      - key: LLM_MODEL
        value: agnes-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: REQUEST_TIMEOUT_SECONDS
        value: 25.0
      - key: MAX_LLM_RETRIES
        value: 1
      - key: SUPABASE_URL
        value: https://vbpzyzexzfguyaoduppq.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
