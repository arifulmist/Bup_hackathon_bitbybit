version: '3.8'

services:
  gridwise-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridwise-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: nginx:alpine
    container_name: gridwise-frontend
    ports:
      - "3000:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
    depends_on:
      - gridwise-api